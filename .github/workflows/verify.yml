name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Smoke packed CLI
        run: |
          tmp="$(mktemp -d)"
          pkg="$(npm pack --pack-destination "$tmp" --silent | tail -n 1)"
          npm install --prefix "$tmp/install" "$tmp/$pkg"
          "$tmp/install/node_modules/.bin/rgk" --rgk-version
